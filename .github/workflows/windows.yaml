name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      - name: Install React Native Windows Package
        run: npm install react-native-windows@0.75.20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Initialize Windows Native Project
        run: npx react-native-windows-init --overwrite --no-telemetry

      # Installs all required C++ VCTools and UWP dependencies for RNW
      - name: Install Visual Studio C++ Workloads
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          Start-Process $installer -ArgumentList 'modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Workload.NativeDesktop --add Microsoft.VisualStudio.Workload.Universal --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --includeRecommended --quiet --norestart' -Wait
        shell: powershell

      - name: Build Windows App (Release)
        run: npx react-native run-windows --logging --release --no-launch

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SajatMusic-Windows-Installer
          path: windows/x64/Release/