name: Build Windows App

on:
  workflow_dispatch: # Only runs when manually triggered in GitHub Actions

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      # Setup MSBuild and NuGet
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Auto-Resize all Windows PNG assets to exact dimensions with transparency preserved
      - name: Auto-Resize All Windows Assets
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $assetsDir = "windows/SajatMusic/Assets"

          $dimensions = @{
              "Square44x44Logo.scale-200.png"                   = @{W=88; H=88}
              "Square150x150Logo.scale-200.png"                 = @{W=300; H=300}
              "Wide310x150Logo.scale-200.png"                  = @{W=620; H=300}
              "Square71x71Logo.scale-200.png"                   = @{W=142; H=142}
              "Square310x310Logo.scale-200.png"                 = @{W=620; H=620}
              "Square44x44Logo.targetsize-24_altform-unplated.png" = @{W=24; H=24}
              "StoreLogo.png"                                   = @{W=50; H=50}
              "StoreLogo.scale-200.png"                         = @{W=100; H=100}
              "SplashScreen.scale-200.png"                       = @{W=1240; H=600}
              "LockScreenLogo.scale-200.png"                     = @{W=48; H=48}
              "Square44x44Logo.png"                             = @{W=44; H=44}
              "Square150x150Logo.png"                           = @{W=150; H=150}
              "Wide310x150Logo.png"                            = @{W=310; H=150}
          }

          foreach ($file in $dimensions.Keys) {
              $path = Join-Path $assetsDir $file
              if (Test-Path $path) {
                  $w = $dimensions[$file].W
                  $h = $dimensions[$file].H

                  $original = [System.Drawing.Image]::FromFile((Get-Item $path).FullName)
                  $bmp = New-Object System.Drawing.Bitmap($w, $h, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
                  $g = [System.Drawing.Graphics]::FromImage($bmp)

                  $g.Clear([System.Drawing.Color]::Transparent)
                  $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                  $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                  $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality

                  $g.DrawImage($original, 0, 0, $w, $h)

                  $original.Dispose()
                  $g.Dispose()

                  $bmp.Save((Get-Item $path).FullName, [System.Drawing.Imaging.ImageFormat]::Png)
                  $bmp.Dispose()
                  Write-Host "Resized $file to ${w}x${h} (Transparent PNG)"
              }
          }

      # Restore solution & nested node_modules packages to windows/packages
      - name: Restore All NuGet Packages
        shell: powershell
        run: |
          nuget restore windows/SajatMusic.sln -PackagesDirectory windows/packages
          Get-ChildItem -Path node_modules -Filter packages.config -Recurse | ForEach-Object { nuget restore $_.FullName -PackagesDirectory windows/packages }

      # Bundle and build via React Native CLI
      - name: Build Windows App (Release)
        run: npx react-native run-windows --arch x64 --release --no-packager --logging

      # Bundle all exact 64-bit UWP *_APP.dll runtime files directly into the app folder
      - name: Copy 64-bit VC++ UWP Runtime DLLs
        shell: powershell
        run: |
          $exeItem = Get-ChildItem -Path "windows\x64\Release" -Recurse -Filter "SajatMusic.exe" | Select-Object -First 1
          $targetDir = $exeItem.DirectoryName
          Write-Host "Target directory: $targetDir"

          # Search specifically for _APP.dll files in Visual Studio VC Redist
          $vcRedistDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          $appDlls = Get-ChildItem -Path $vcRedistDir -Recurse -Filter "*_APP.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "onecore" -or $_.FullName -match "x64" }

          foreach ($dll in $appDlls) {
              Copy-Item -Path $dll.FullName -Destination $targetDir -Force
              Write-Host "Bundled UWP DLL: $($dll.Name)"
          }

          # Also check Windows Kits for additional UWP framework DLLs
          $winKitsDir = "C:\Program Files (x86)\Windows Kits\10\ExtensionSDKs"
          $kitDlls = Get-ChildItem -Path $winKitsDir -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" -and $_.Name -like "*_APP.dll" }

          foreach ($dll in $kitDlls) {
              Copy-Item -Path $dll.FullName -Destination $targetDir -Force
              Write-Host "Bundled Kit DLL: $($dll.Name)"
          }

      # Compress using 7-Zip with -ssw (Ignores open file locks)
      - name: Zip Windows Release Files
        shell: powershell
        run: |
          7z a -ssw -r SajatMusic-Windows.zip .\windows\x64\Release\*

      # Upload to GitHub Releases
      - name: Publish Windows App to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Latest SajatMusic Release
          body: "Download the latest compiled Android APK or Windows build below."
          files: SajatMusic-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}