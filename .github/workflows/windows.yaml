name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      - name: Install React Native Windows Package
        run: npm install react-native-windows@0.75.20

      - name: Initialize Windows Native Project
        run: npx react-native-windows-init --overwrite --no-telemetry

      - name: Build Windows App (Release)
        run: npx react-native run-windows --logging --release --no-launch

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SajatMusic-Windows-Installer
          path: windows/x64/Release/