name: Build Windows App

on:
  push:
    branches: [ main ]
    if: false # Disable automatic builds on push to main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      # Setup MSBuild and NuGet
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Restore solution & nested node_modules packages to windows/packages
      - name: Restore All NuGet Packages
        shell: powershell
        run: |
          nuget restore windows/SajatMusic.sln -PackagesDirectory windows/packages
          Get-ChildItem -Path node_modules -Filter packages.config -Recurse | ForEach-Object { nuget restore $_.FullName -PackagesDirectory windows/packages }

      # Bundle and build via React Native CLI (resolves async-storage & native deps automatically)
      - name: Build Windows App (Release)
        run: npx react-native run-windows --arch x64 --release --no-packager --logging

      # Upload Artifacts
      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SajatMusic-Windows-Installer
          path: windows/x64/Release/