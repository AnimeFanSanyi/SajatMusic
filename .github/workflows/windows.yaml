name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      # Setup MSBuild and NuGet
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Restore NuGet packages for the React Native Windows solution
      - name: Restore NuGet Packages
        run: nuget restore windows/SajatMusic.sln

      # Build Windows App (Release)
      - name: Build Windows App (Release)
        run: msbuild windows/SajatMusic.sln /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxPackageSigningEnabled=false /p:WindowsTargetPlatformVersion=10.0

      # Upload Artifacts
      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SajatMusic-Windows-Installer
          path: windows/x64/Release/