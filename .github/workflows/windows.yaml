name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      - name: Install React Native Windows Package
        run: npm install react-native-windows@0.75.20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Initialize Windows Native Project
        run: npx react-native-windows-init --overwrite --no-telemetry

      # NEW STEP: Automatically installs missing C++ VCTools / Visual Studio components
      - name: Install RNW C++ Dependencies
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          & "node_modules/react-native-windows/scripts/rnw-dependencies.ps1" -Install -NoPrompt
        shell: powershell

      - name: Build Windows App (Release)
        run: npx react-native run-windows --logging --release --no-launch

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SajatMusic-Windows-Installer
          path: windows/x64/Release/