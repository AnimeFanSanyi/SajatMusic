name: Build Windows App

on:
  workflow_dispatch: # Only runs when manually triggered in GitHub Actions

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Force Legacy Peer Deps Globally
        run: npm config set legacy-peer-deps true

      - name: Install Dependencies
        run: npm install

      # Setup MSBuild and NuGet
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Restore solution & nested node_modules packages to windows/packages
      - name: Restore All NuGet Packages
        shell: powershell
        run: |
          nuget restore windows/SajatMusic.sln -PackagesDirectory windows/packages
          Get-ChildItem -Path node_modules -Filter packages.config -Recurse | ForEach-Object { nuget restore $_.FullName -PackagesDirectory windows/packages }

      # Bundle and build via React Native CLI
      - name: Build Windows App (Release)
        run: npx react-native run-windows --arch x64 --release --no-packager --logging

      # Copy missing C++ Runtime DLLs into the app directory so it runs portably
      - name: Copy VC++ Runtime DLLs
        shell: powershell
        run: |
          $crtFiles = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist" -Filter "*_APP.dll" -Recurse
          foreach ($file in $crtFiles) {
              Copy-Item -Path $file.FullName -Destination "windows\x64\Release\SajatMusic\" -Force
          }

      # Compress using 7-Zip with -ssw (Ignores open file locks)
      - name: Zip Windows Release Files
        shell: powershell
        run: |
          7z a -ssw -r SajatMusic-Windows.zip .\windows\x64\Release\*

      # Upload to GitHub Releases
      - name: Publish Windows App to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Latest SajatMusic Release
          body: "Download the latest compiled Android APK or Windows build below."
          files: SajatMusic-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}